<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Querés ser mi novia Valentina Macarena?</title>
    <!-- Tailwind CSS for modern, responsive utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for romantic typography -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2b0914 0%, #1a050c 100%);
            overflow-x: hidden;
        }
        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }
        .font-playfair {
            font-family: 'Playfair Display', serif;
        }
        /* Floating hearts background animation */
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
        .floating-heart {
            position: absolute;
            color: rgba(236, 72, 153, 0.3);
            animation: floatUp 6s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative text-white selection:bg-pink-500 selection:text-white">

    <!-- Background subtle ambient glow -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#5a142c] via-[#2b0914] to-[#120307] pointer-events-none -z-10"></div>

    <!-- Container for floating hearts (active on celebration) -->
    <div id="hearts-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- Main Card Container -->
    <main class="relative z-10 w-full max-w-xl mx-4 p-8 sm:p-12 bg-[#3d0c1e]/80 backdrop-blur-md rounded-3xl shadow-2xl border border-pink-500/20 text-center transition-all duration-700">
        
        <!-- Initial Question View -->
        <div id="question-view" class="space-y-8">
            <div class="inline-block p-4 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-400 mb-2 animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <h1 class="font-playfair text-3xl sm:text-4xl md:text-5xl font-semibold tracking-wide leading-tight text-pink-100">
                ¿Querés ser mi novia <br>
                <span class="font-cursive text-5xl sm:text-6xl text-pink-400 font-normal drop-shadow-md">Valentina Macarena</span>?
            </h1>

            <!-- Buttons Grid: Large side-by-side boxes -->
            <div id="buttons-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4">
                <button id="btn-yes" onclick="handleYes()" class="group relative px-8 py-5 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-semibold text-lg rounded-2xl shadow-lg shadow-pink-900/40 transform hover:-translate-y-1 transition-all duration-300 border border-pink-400/30 cursor-pointer flex items-center justify-center space-x-2">
                    <span class="tracking-wide">SI</span>
                </button>
                <button id="btn-no" onclick="handleNo()" class="group relative px-8 py-5 bg-[#25050e] hover:bg-[#320814] text-pink-200/80 hover:text-white font-medium text-lg rounded-2xl shadow-lg border border-pink-900/40 transform hover:-translate-y-0.5 transition-all duration-300 cursor-pointer flex items-center justify-center space-x-2">
                    <span class="tracking-wide">NO</span>
                </button>
            </div>
        </div>

        <!-- Celebration View (Hidden by default) -->
        <div id="celebration-view" class="hidden space-y-6 animate-fade-in">
            <div class="inline-block p-4 rounded-full bg-pink-500/20 border border-pink-500/40 text-pink-400 mb-2 animate-bounce">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <p class="font-playfair text-3xl sm:text-4xl md:text-5xl font-bold leading-tight text-pink-300 py-4 drop-shadow">
                Ahora sí puedo decirte que sos mi novia, gordita hermosa
            </p>

            <div class="pt-4 border-t border-pink-500/20 text-pink-200 font-light text-base sm:text-lg">
                Te amo mucho mi amor ❤️
            </div>
        </div>

    </main>

    <!-- JavaScript interaction and effects -->
    <script>
        function handleYes() {
            // Hide question view and show celebration view
            document.getElementById('question-view').classList.add('hidden');
            document.getElementById('celebration-view').classList.remove('hidden');

            // Trigger floating hearts animation
            createFloatingHearts();
        }

        function handleNo() {
            // El botón no hace nada, se queda en la pantalla principal tal cual lo pediste
        }

        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const heartSymbols = ['❤️', '💖', '💗', '💓', '✨'];

            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'absolute floating-heart text-2xl sm:text-4xl';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                container.appendChild(heart);

                // Remove heart element after animation ends
                setTimeout(() => {
                    heart.remove();
                }, 7000);
            }, 300);
        }
    </script>
</body>
</html>
